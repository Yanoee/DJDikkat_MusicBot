name: Translations

on:
  pull_request:
    paths: ['translations/**', '.github/scripts/check-translations.mjs', '.github/workflows/translations.yml']
  push:
    branches: [main]
    paths: ['translations/**']

permissions:
  contents: read

jobs:
  check:
    name: Same keys and placeholders as English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-translations.mjs
